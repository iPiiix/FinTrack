name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag al que subir el .exe (ej: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ── macOS (arm64 + x64) — solo en push de tag ──────────────────
  build-mac:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fintrack-web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: fintrack-web

      - name: Build macOS (arm64 + x64)
        run: npm run build:mac
        working-directory: fintrack-web
        env:
          ELECTRON_BUILD: '1'

      - name: Upload DMGs to release
        uses: softprops/action-gh-release@v2
        with:
          files: fintrack-web/dist/*.dmg

  # ── Windows (x64) — en push de tag O manualmente ───────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fintrack-web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: fintrack-web

      - name: Build Windows (.exe)
        run: npm run build:win
        working-directory: fintrack-web
        env:
          ELECTRON_BUILD: '1'

      - name: Upload EXE to release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fintrack-web/dist/*.exe

      - name: Upload EXE to existing release (manual)
        if: github.event_name == 'workflow_dispatch'
        run: gh release upload ${{ inputs.tag }} (Get-ChildItem fintrack-web/dist/*.exe | Select-Object -First 1).FullName --clobber
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
