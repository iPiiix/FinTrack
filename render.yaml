databases:
  - name: fintrack-db
    plan: free
    databaseName: fintrack
    user: fintrack_user

services:
  - type: web
    name: fintrack-api
    runtime: python
    plan: free
    rootDir: ./backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fintrack-db
          property: connectionURI
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: FRONTEND_URL
        sync: false  # Set this manually to your Vercel URL
      - key: ADMIN_PANEL_USER
        value: admin
      - key: ADMIN_PANEL_PASSWORD
        sync: false  # Set this manually
      - key: ADMIN_PANEL_SECRET
        generateValue: true
      - key: SMTP_EMAIL
        sync: false  # Optional: set manually
      - key: SMTP_PASSWORD
        sync: false  # Optional: set manually
      - key: ADMIN_EMAIL
        sync: false  # Optional: set manually
      - key: PYTHON_VERSION
        value: "3.11"
